services:
  - type: web
    name: uzimatek-api
    runtime: node
    plan: free
    buildCommand: pnpm install --config.approve-builds=1 && pnpm --filter @uzimatek/db db:generate && pnpm --filter @uzimatek/shared-types build && pnpm --filter @uzimatek/ai build && pnpm --filter @uzimatek/api build
    startCommand: node dist/app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
