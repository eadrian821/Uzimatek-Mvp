[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --config.approve-builds=1 && pnpm --filter @uzimatek/db db:generate"

[deploy]
startCommand = "node node_modules/.pnpm/tsx@4.21.0/node_modules/tsx/dist/cli.mjs apps/api/src/app.ts"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
